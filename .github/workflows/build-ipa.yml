name: Build DLiPA Legacy iOS 9+ IPA & Web Studio

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      min_ios_version:
        description: 'Target Minimum iOS Version (patched via Mach-O vtool & Info.plist)'
        required: true
        default: '9.0'
        type: choice
        options:
          - '9.0'
          - '9.3'
          - '10.3'
          - '12.0'
          - '13.0'
      sign_method:
        description: 'Code Signing Method'
        required: true
        default: 'ldid-adhoc'
        type: choice
        options:
          - 'ldid-adhoc'
          - 'unsigned'

permissions:
  contents: write

jobs:
  build-ios-ipa:
    name: Build Native iOS 9.0+ IPA (macOS Xcode)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen & ldid
        run: |
          brew install xcodegen ldid

      - name: Generate Xcode Project from ios/project.yml
        working-directory: ios
        run: |
          xcodegen generate

      - name: Build Unsigned Release Archive
        working-directory: ios
        run: |
          xcodebuild clean build \
            -project DLiPA-Legacy.xcodeproj \
            -scheme DLiPA-Legacy \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            COPY_PHASE_STRIP=YES

      - name: Backport Mach-O Header & Info.plist to iOS ${{ inputs.min_ios_version || '9.0' }}
        working-directory: ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/DLiPA.app"
          BINARY_PATH="$APP_PATH/DLiPA"
          TARGET_IOS="${{ inputs.min_ios_version || '9.0' }}"

          echo "Patching Info.plist MinimumOSVersion -> $TARGET_IOS"
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion $TARGET_IOS" "$APP_PATH/Info.plist" || \
            /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string $TARGET_IOS" "$APP_PATH/Info.plist"

          # Remove arm64-only lock in UIRequiredDeviceCapabilities for legacy iOS compatibility
          /usr/libexec/PlistBuddy -c "Delete :UIRequiredDeviceCapabilities" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities array" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities:0 string armv7" "$APP_PATH/Info.plist"

          # Backport Mach-O LC_BUILD_VERSION minos to iOS 9.0 using Xcode's vtool
          if command -v xcrun >/dev/null 2>&1; then
            xcrun vtool -set-build-version ios "$TARGET_IOS" 16.0 -replace -output "$BINARY_PATH" "$BINARY_PATH" || true
          fi

          # Bundle Swift 5.0 Runtime Compatibility Libraries if present in Xcode toolchain
          SWIFT_COMPAT_DIR="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/iphoneos"
          if [ -d "$SWIFT_COMPAT_DIR" ]; then
            mkdir -p "$APP_PATH/Frameworks"
            cp -f "$SWIFT_COMPAT_DIR"/libswiftCompatibility*.dylib "$APP_PATH/Frameworks/" 2>/dev/null || true
          fi

      - name: Ad-Hoc Sign Binary & Frameworks with ldid
        if: ${{ (inputs.sign_method || 'ldid-adhoc') == 'ldid-adhoc' }}
        working-directory: ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/DLiPA.app"
          if [ -d "$APP_PATH/Frameworks" ]; then
            find "$APP_PATH/Frameworks" -name "*.dylib" -exec ldid -S {} \;
          fi
          ldid -SResources/Entitlements.plist "$APP_PATH/DLiPA"

      - name: Package .IPA Archive
        working-directory: ios
        run: |
          mkdir -p dist/Payload
          cp -R "build/Build/Products/Release-iphoneos/DLiPA.app" dist/Payload/
          cd dist
          zip -r9 "../DLiPA_v1.4_iOS9_Compat.ipa" Payload

      - name: Upload DLiPA iOS 9+ IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLiPA-iOS9-Compatible-IPA
          path: ios/DLiPA_v1.4_iOS9_Compat.ipa
          if-no-files-found: error

      - name: Publish IPA to GitHub Release (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/DLiPA_v1.4_iOS9_Compat.ipa
          generate_release_notes: true
          body: |
            ### Upstream Credit & Attribution
            - **Original DLiPA Project & Author:** [AhmedBafkir/DLiPA](https://github.com/AhmedBafkir/DLiPA) by **Ahmed Bafkir** ([Support Original Developer via PayPal](https://www.paypal.com/ncp/payment/RLKKWBYSKSPVU))
            - **Inspired by:** [majd/ipatool](https://github.com/majd/ipatool) by **Majd Alfhaily**
            - **Compatibility Target:** iOS 9.0+ (`armv7` & `arm64`)

  build-web-studio:
    name: Verify Web Compatibility Studio & Express API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Build Frontend Bundle
        run: |
          npm run lint
          npm run build
